version: 2

registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.PACKAGES_TOKEN}}

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    registries:
      - github-packages
    allow:
      - dependency-name: "@maktorni/*"
