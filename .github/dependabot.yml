version: 2

registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.PACKAGES_TOKEN}}

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    registries:
      - github-packages
    allow:
      - dependency-name: "@maktorni/*"
    # Our own packages skip the supply-chain cooldown; third-party ones would still wait.
    cooldown:
      default-days: 7
      exclude:
        - "@maktorni/*"
